services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: habstreak-frontend
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    environment: 
      VITE_BACKEND_URL: "${BACKEND_URL}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: habstreak_backend
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    environment:
      PORT: "${PORT}"
      FRONTEND_URL: "${FRONTEND_URL}"
      REDIS_HOST: redis
      REDIS_PORT: "${REDIS_PORT}"
      DATABASE_URL: "${DATABASE_URL_DOC}"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/mode_modules
    depends_on:
      postgres:
          condition: service_healthy
      redis:
          condition: service_healthy
    
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: habstreak-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: auth_db
    ports:
      - "${DATABASE_PORT}:${DATABASE_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: habstreak-redis
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  
  email-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: habstreak-email-worker
    command: ["bun", "--watch", "workers/email.worker.ts"]
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      DATABASE_URL: "${DATABASE_URL_DOC}"
      REDIS_HOST: redis
      REDIS_PORT: "${REDIS_PORT}"
      FRONTEND_URL: "${FRONTEND_URL}"
      BACKEND_URL: "${BACKEND_URL}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  outbox-publisher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: habstreak-outbox-publisher
    command: ["bun", "--watch", "workers/outbox.publisher.ts"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "${DATABASE_URL_DOC}"
      REDIS_HOST: redis
      REDIS_PORT: "${REDIS_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped


volumes:
  frontend_node_modules:
  backend_node_modules:
  postgres_data:
  redis_data: